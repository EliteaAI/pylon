name: Trivy image scan

# Reusable workflow: called by docker_image.yml and docker_tag.yml after the image is pushed.
# Results go to Security -> Code scanning. Report only: never fails the build.

on:
  workflow_call:
    inputs:
      image:
        description: "Image reference to scan, e.g. ghcr.io/eliteaai/pylon:1.2.30"
        required: true
        type: string
      category:
        description: "Code scanning category, keeps results of different images apart"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image:
        description: "Image reference to scan, e.g. ghcr.io/eliteaai/pylon:1.2.30"
        required: true
        type: string
      category:
        description: "Code scanning category (trivy-pylon or trivy-pylon-tools)"
        required: true
        default: "trivy-pylon"
        type: string
      runner:
        type: choice
        description: 'Action runs on'
        options:
          - self-hosted
          - ubuntu-latest
        required: true

permissions:
  contents: read
  packages: read
  security-events: write

env:
  TRIVY_VERSION: v0.76.1

jobs:
  trivy:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner || fromJSON('["self-hosted", "Linux"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Scan image
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ inputs.image }}
        run: |
          trivy image "$IMAGE" \
            --image-src remote \
            --platform linux/amd64 \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            --format json \
            --output trivy.json

      - name: Convert results
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          trivy convert --format sarif --output trivy.raw.sarif trivy.json
          trivy convert --format table --output trivy.txt trivy.json
          # Add scanned image and digest to every alert, so it is visible in Security -> Code scanning
          DIGEST=$(jq -r '(.Metadata.RepoDigests[0] // "") | sub("^[^@]*@"; "")' trivy.json)
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          jq --arg image "$IMAGE" --arg digest "$DIGEST" '
            ("Image: " + $image + (if $digest != "" then "\nImage digest: " + $digest else "" end)) as $info
            | ("**Image:** `" + $image + "`" + (if $digest != "" then "  \n**Image digest:** `" + $digest + "`" else "" end)) as $md
            | .runs[].results[]?.message.text |= ($info + "\n" + .)
            | .runs[].tool.driver.rules[]?.help |= (
                if . == null then . else
                  (.text |= ($info + "\n" + (. // "")))
                  | (.markdown |= ($md + "\n\n" + (. // "")))
                end)
          ' trivy.raw.sarif > trivy.sarif

      - name: Write job summary
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          {
            echo "## Trivy scan: \`$IMAGE\`"
            [ -n "$DIGEST" ] && echo "Image digest: \`$DIGEST\`"
            echo "Severity: HIGH, CRITICAL (fixable only). Full results: Security -> Code scanning."
            echo '```'
            head -c 900000 trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat trivy.txt

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: ${{ inputs.category }}
          # Tag builds would otherwise be filed under refs/tags/*, hidden from the default Security view
          ref: ${{ startsWith(github.ref, 'refs/tags/') && format('refs/heads/{0}', github.event.repository.default_branch) || github.ref }}
          sha: ${{ github.sha }}
