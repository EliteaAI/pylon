name: Build and push Docker multiarch image from tag

on:
  push:
    tags: [ '*' ]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  docker-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        id: buildx

      - name: Login to Docker Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          tags: ghcr.io/eliteaai/pylon:${{ github.ref_name }}
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=true

      - name: Build and push (tools)
        uses: docker/build-push-action@v4
        with:
          tags: ghcr.io/eliteaai/pylon:${{ github.ref_name }}-tools
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          push: true
          file: Dockerfile.tools
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=true
            BASE_IMAGE=ghcr.io/eliteaai/pylon:${{ github.ref_name }}

  scan:
    needs: docker-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/eliteaai/pylon:${{ github.ref_name }}
            category: trivy-pylon
          - image: ghcr.io/eliteaai/pylon:${{ github.ref_name }}-tools
            category: trivy-pylon-tools
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/trivy_scan.yml
    with:
      image: ${{ matrix.image }}
      category: ${{ matrix.category }}
